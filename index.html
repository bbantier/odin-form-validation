<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Form Validation</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <form action="" class="test-form" novalidate>
      <div class="email-div form-control-div">
        <label for="email">Email: </label>
        <input id="email-input" minlength="8" type="email" name="email">
        <span class="email-error"></span>
      </div>
      <div class="country-div form-control-div">
        <label for="country">Country: </label>
        <input id="country-input" type="text" name="country">
        <span class="country-error"></span>
      </div>
      <div class="zip-div form-control-div">
        <label for="zip">Zip code: </label>
        <input id="zip-input" type="text" name="zip">
        <span class="zip-error"></span>
      </div>
      <div class="pass-div form-control-div">
        <label for="pass">Password: </label>
        <input id="pass-input" type="password" name="pass">
        <span class="pass-error"></span>
      </div>
      <div class="conf-div form-control-div">
        <label for="conf">Confirm password: </label>
        <input id="conf-input" type="password" name="pass-conf">
        <span class="conf-error"></span>
      </div>
      <div class="submit-div form-control-div">
        <button type="submit">Submit</button>
      </div>
    </form>
    <span class="congrats-message"></span>
  </body>
</html>
